name: Deploy OpenAPI to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build API reference
        run: |
          version="${{ github.event.release.tag_name }}"
          if [ -z "$version" ]; then
            version="$(git describe --tags --abbrev=0)"
          fi
          mkdir -p site/swagger-ui
          jq --arg version "$version" '.info.version = $version' docs/openapi.json > site/openapi.json
          cp .github/pages/openapi-index.html site/index.html
          cp public/vendor/swagger-ui/swagger-ui.css public/vendor/swagger-ui/swagger-ui-bundle.js site/swagger-ui/
          test -s site/openapi.json
      - name: Publish API reference
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=movary-api --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
