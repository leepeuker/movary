name: Build and publish docker image to docker hub

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  IMAGE_NAME: leepeuker/movary

jobs:
  validate_release:
    name: Validate release source and tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          bash tests/container/validate-release-tag.sh "$RELEASE_TAG" "$RELEASE_IS_PRERELEASE"

          release_commit=$(git rev-list -n 1 "$RELEASE_TAG^{commit}")
          checked_out_commit=$(git rev-parse HEAD)

          if [[ "$release_commit" != "$checked_out_commit" || "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag, checkout, and event do not identify the same commit" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG at $release_commit"

  run_tests:
    name: Run release validation
    needs: validate_release
    uses: ./.github/workflows/tests.yml

  push_to_registry:
    name: Validate and publish Docker image
    needs:
      - validate_release
      - run_tests
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dockerhub-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_release.outputs.release_commit }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create candidate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=candidate-release-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Movary
            org.opencontainers.image.description=Movary is a self hosted web app to track and rate your watched movies
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate_release.outputs.release_commit }}
            org.opencontainers.image.version=${{ needs.validate_release.outputs.release_tag }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          target: production
          no-cache-filters: base
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPLICATION_VERSION=${{ needs.validate_release.outputs.release_tag }}
            APPLICATION_REVISION=${{ needs.validate_release.outputs.release_commit }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Verify candidate image index
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/verify-image-index.sh "$IMAGE_NAME@$CANDIDATE_DIGEST"

      - name: Verify candidate image attestations
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/verify-image-attestations.sh "$IMAGE_NAME@$CANDIDATE_DIGEST"

      - name: Smoke-test amd64 candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/smoke-production.sh "$IMAGE_NAME@$CANDIDATE_DIGEST" linux/amd64

      - name: Smoke-test arm64 candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_TIMEOUT_SECONDS: 300
        run: bash tests/container/smoke-production.sh "$IMAGE_NAME@$CANDIDATE_DIGEST" linux/arm64

      - name: Scan amd64 candidate for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-amd64.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Enforce amd64 vulnerability policy
        run: bash tests/container/check-vulnerability-scan.sh trivy-amd64.json

      - name: Scan arm64 candidate for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-arm64.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Enforce arm64 vulnerability policy
        run: bash tests/container/check-vulnerability-scan.sh trivy-arm64.json

      - name: Promote validated release image
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.release_commit }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source_reference="$IMAGE_NAME@$CANDIDATE_DIGEST"
          identity_tag="$IMAGE_NAME:sha-$RELEASE_COMMIT-$RELEASE_TAG"
          immutable_tags=("$IMAGE_NAME:$RELEASE_TAG" "$identity_tag")
          moving_tags=()

          if [[ "$RELEASE_IS_PRERELEASE" == false ]]; then
            published_stable_tags=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
            moving_tag_suffixes=$(printf '%s\n' "$published_stable_tags" \
              | bash tests/container/select-release-aliases.sh "$RELEASE_TAG")

            while IFS= read -r moving_tag_suffix; do
              if [[ -n "$moving_tag_suffix" ]]; then
                moving_tags+=("$IMAGE_NAME:$moving_tag_suffix")
              fi
            done <<<"$moving_tag_suffixes"
          fi

          for immutable_tag in "${immutable_tags[@]}"; do
            bash tests/container/promote-immutable-image.sh \
              "$source_reference" "$immutable_tag" "$CANDIDATE_DIGEST"
          done

          for moving_tag in "${moving_tags[@]}"; do
            docker buildx imagetools create --tag "$moving_tag" "$source_reference"
          done

          for promoted_tag in "${immutable_tags[@]}" "${moving_tags[@]}"; do
            bash tests/container/verify-promoted-image.sh "$promoted_tag" "$CANDIDATE_DIGEST"
          done

          {
            echo "### Published Movary $RELEASE_TAG"
            echo
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Digest: \`$CANDIDATE_DIGEST\`"
            echo '- Copy this digest into the GitHub release notes.'
          } >> "$GITHUB_STEP_SUMMARY"
