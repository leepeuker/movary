name: Build and publish nightly docker image to docker hub

on:
  workflow_run:
    workflows:
      - Run tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dockerhub-nightly-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  IMAGE_NAME: leepeuker/movary

jobs:
  push_to_registry:
    name: Validate and publish nightly Docker image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create candidate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=candidate-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Movary
            org.opencontainers.image.description=Movary is a self hosted web app to track and rate your watched movies
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=nightly
            org.opencontainers.image.licenses=MIT

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          target: production
          no-cache-filters: base
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPLICATION_VERSION=nightly
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Verify candidate image index
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/verify-image-index.sh "$IMAGE_NAME@$CANDIDATE_DIGEST"

      - name: Verify candidate image attestations
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/verify-image-attestations.sh "$IMAGE_NAME@$CANDIDATE_DIGEST"

      - name: Smoke-test amd64 candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash tests/container/smoke-production.sh "$IMAGE_NAME@$CANDIDATE_DIGEST" linux/amd64

      - name: Scan amd64 candidate for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-amd64.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Enforce amd64 vulnerability policy
        run: bash tests/container/check-vulnerability-scan.sh trivy-amd64.json

      - name: Scan arm64 candidate for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-arm64.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Enforce arm64 vulnerability policy
        run: bash tests/container/check-vulnerability-scan.sh trivy-arm64.json

      - name: Promote validated nightly image
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          VALIDATED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          source_reference="$IMAGE_NAME@$CANDIDATE_DIGEST"
          identity_tag="$IMAGE_NAME:sha-$VALIDATED_COMMIT-nightly"

          assert_current_main_head() {
            local remote_main
            remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$remote_main" != "$VALIDATED_COMMIT" ]]; then
              echo "Validated commit $VALIDATED_COMMIT is no longer the main branch head ($remote_main)" >&2
              exit 1
            fi
          }

          assert_current_main_head

          bash tests/container/promote-immutable-image.sh \
            "$source_reference" "$identity_tag" "$CANDIDATE_DIGEST"

          assert_current_main_head
          docker buildx imagetools create --tag "$IMAGE_NAME:nightly" "$source_reference"

          for promoted_tag in "$identity_tag" "$IMAGE_NAME:nightly"; do
            bash tests/container/verify-promoted-image.sh "$promoted_tag" "$CANDIDATE_DIGEST"
          done

          {
            echo '### Published nightly image'
            echo
            echo "- Commit: \`$VALIDATED_COMMIT\`"
            echo "- Digest: \`$CANDIDATE_DIGEST\`"
            echo "- Tags: \`nightly\`, \`sha-$VALIDATED_COMMIT-nightly\`"
          } >> "$GITHUB_STEP_SUMMARY"
