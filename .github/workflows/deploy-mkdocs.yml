name: Deploy MkDocs to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build documentation
        run: docker run --rm -v "$PWD:/docs" squidfunk/mkdocs-material:latest build --strict
      - name: Publish documentation
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=movary-docs --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
