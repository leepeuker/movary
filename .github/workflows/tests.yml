name: Run tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  verify_frontend_assets:
    name: Verify frontend assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated frontend assets
        run: USER_ID="$(id -u)" GROUP_ID="$(id -g)" make frontend_check

  audit_frontend_dependencies:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check locked production dependencies for security advisories
        run: >-
          docker run --rm
          --mount type=bind,src=${{ github.workspace }}/package.json,dst=/app/package.json,readonly
          --mount type=bind,src=${{ github.workspace }}/package-lock.json,dst=/app/package-lock.json,readonly
          --workdir /app
          node:24.22.0-alpine3.23@sha256:e44c87c7dd212720eb00469aeac89504ca2be77b8f0d6dbffb30665d5fcc59e1
          npm audit --package-lock-only --ignore-scripts --omit=dev --audit-level=high

  audit_composer_dependencies:
    name: Audit Composer dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check locked production dependencies for security advisories
        run: >-
          docker run --rm
          --mount type=bind,src=${{ github.workspace }}/composer.json,dst=/app/composer.json,readonly
          --mount type=bind,src=${{ github.workspace }}/composer.lock,dst=/app/composer.lock,readonly
          --workdir /app
          composer:2.10.3@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
          audit --locked --no-dev --no-interaction

  validate_openapi:
    name: Validate OpenAPI specification
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate OpenAPI specification
        run: make openapi_validate OPENAPI_OUTPUT_FORMAT=github-actions

  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate release tag rules
        run: bash tests/container/validate-release-tag.sh --self-test

      - name: Validate release alias selection
        run: bash tests/container/select-release-aliases.sh --self-test

      - name: Validate promoted image verification
        run: bash tests/container/verify-promoted-image.sh --self-test

      - name: Validate immutable image promotion
        run: bash tests/container/promote-immutable-image.sh --self-test

      - name: Validate image vulnerability scan policy
        run: bash tests/container/check-vulnerability-scan.sh --self-test

      - name: Validate image attestation policy
        run: bash tests/container/verify-image-attestations.sh --self-test

      - name: Build Docker development image
        run: >-
          docker buildx build
          --load
          --target development
          --tag movary-development
          --cache-from type=gha,scope=development
          --cache-to type=gha,mode=max,scope=development
          -f ./build/Dockerfile
          .

      - name: Check code style
        run: docker run --rm --entrypoint composer movary-development test-cs

      - name: Run PHPStan
        run: docker run --rm --entrypoint composer movary-development test-phpstan

      - name: Run Psalm
        run: docker run --rm --entrypoint composer movary-development test-psalm

      - name: Run unit tests
        run: docker run --rm --entrypoint composer movary-development test-unit

      - name: Run API tests
        run: ./tests/api/run.sh movary-development

      - name: Verify migration cutover
        run: bash tests/migration/verify-cutover.sh movary-development

      - name: Build Docker production image
        run: >-
          docker buildx build
          --load
          --platform linux/amd64
          --target production
          --tag movary-production
          --build-arg APPLICATION_VERSION=ci
          --cache-from type=gha,scope=production
          --cache-to type=gha,mode=max,scope=production
          -f ./build/Dockerfile
          .

      - name: Smoke-test Docker production image
        run: bash tests/container/smoke-production.sh movary-production linux/amd64
