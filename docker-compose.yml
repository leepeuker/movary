services:
  app:
    build:
      context: ./
      dockerfile: ./build/Dockerfile
      target: production
      args:
        - USER_ID=${USER_ID:-3000}
        - GROUP_ID=${GROUP_ID:-3000}
    ports:
      - "${HTTP_PORT:-80}:8080"
    environment:
      APPLICATION_SECRET: "${APPLICATION_SECRET}"
      TMDB_API_KEY: "${TMDB_API_KEY:-XXXXX}"
      TMDB_ENABLE_IMAGE_CACHING: "${TMDB_ENABLE_IMAGE_CACHING:-0}"
