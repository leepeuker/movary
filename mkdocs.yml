site_name: Movary Documentation
site_description: Movary Documentation
repo_url: https://github.com/leepeuker/movary/
edit_uri: edit/main/docs

theme:
  name: material
  language: en
  logo: images/favicon.png
  favicon: images/favicon.png
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: indigo
      accent: indigo
  features:
    - content.action.edit
    - content.action.view

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: 'index.md'
  - Installation:
      - Docker (recommended): install/docker.md
      - Manual: install/manual.md
  - Getting started: 'getting-started.md'
  - Administration:
      - Overview: 'administration.md'
      - Configuration: 'configuration.md'
      - Metadata:
          - TMDB data: features/tmdb-data.md
          - IMDb ratings: features/imdb-rating.md
      - User management: 'user-management.md'
      - Email operations: 'email-operations.md'
      - Job processing: 'job-processing.md'
      - Backup and restore: 'backup-and-restore.md'
  - User guide:
      - Overview: 'user-guide/index.md'
      - Movie tracking: 'user-guide/tracking-movies.md'
      - Browsing movies and people: 'user-guide/browsing-movies-and-people.md'
      - Dashboard and statistics: 'user-guide/dashboard-and-statistics.md'
      - Account and security: 'user-guide/account-and-security.md'
      - Privacy and sharing: 'user-guide/privacy-and-sharing.md'
      - Locations: 'user-guide/locations.md'
      - Personal data: 'user-guide/personal-data.md'
      - API authentication: 'user-guide/api-authentication.md'
  - Integrations:
      - Plex: features/plex.md
      - Jellyfin: features/jellyfin.md
      - Emby: features/emby.md
      - Kodi: features/kodi.md
      - Letterboxd: features/letterboxd.md
      - Trakt TV: features/trakt.md
      - Netflix: features/netflix.md
      - Radarr: features/radarr.md
      - Mastodon: features/mastodon.md
  - Development:
      - Setup: development/setup.md
      - Directory structure: development/file-structure.md
      - How does the backend work?: development/structure.md
      - Job processing internals: development/job-processing.md
      - Database migrations: development/database-migrations.md
  - FAQ: 'faq.md'
